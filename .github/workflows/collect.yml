name: collect

# Hourly batch collection (one job for the whole portal, ~50 requests at 3 s spacing).
# Change the cron to adjust cadence. GitHub may delay scheduled runs at busy times.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      prefectures:
        description: "Comma-separated prefecture ids for a partial test run (blank = all)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["paraca/**", "data/financials.csv", ".github/workflows/collect.yml"]

concurrency:
  group: collect          # never two writers on the data branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PARACA_MIN_INTERVAL: "3"
      PARACA_MAX_REQUESTS: "200"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check out durable store (data branch) into ./store
        run: |
          git fetch --depth=1 origin data
          git worktree add --detach store origin/data

      - name: Collect
        id: collect
        continue-on-error: true   # a partial run is still recorded and exported
        run: |
          if [ -n "${{ github.event.inputs.prefectures }}" ]; then
            python -m paraca.cli collect --db store/paraca.sqlite --prefectures "${{ github.event.inputs.prefectures }}"
          else
            python -m paraca.cli collect --db store/paraca.sqlite
          fi

      - name: Export CSV + dashboard JSON
        run: python -m paraca.cli export --db store/paraca.sqlite --out store

      - name: Back up database as artifact
        uses: actions/upload-artifact@v4
        with:
          name: paraca-sqlite-${{ github.run_id }}
          path: store/paraca.sqlite
          retention-days: 30

      - name: Publish (rolling single commit on data branch)
        run: |
          cd store
          git config user.name "paraca-collector[bot]"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan snapshot   # keeps the working tree (switch --orphan would empty it)
          git add -A
          git commit -qm "data: run ${{ github.run_id }} ($(date -u +%FT%TZ))"
          ok=0
          for i in 1 2 3; do git push --force origin HEAD:data && ok=1 && break; sleep 10; done
          [ "$ok" = 1 ] || { echo "::error::could not push to data branch"; exit 1; }

      - name: Fail job if collection failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::collection was partial or failed; see run log and quality.json"
          exit 1
