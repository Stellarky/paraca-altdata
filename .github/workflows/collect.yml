name: collect

# Hourly collection that does not rely on GitHub's cron alone.
# Each job loops for ~3 h (one batch per hour at :17 UTC), publishes after every
# batch, then dispatches its own successor (workflow_dispatch is allowed for
# GITHUB_TOKEN). The cron below is only a safety net that restarts the chain.
# `concurrency` keeps at most one running job + one pending, so chains never multiply.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      one_shot:
        description: "Run a single batch and stop the chain"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["paraca/**", "scripts/**", "data/financials.csv", ".github/workflows/collect.yml", "requirements.txt"]

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      PARACA_MIN_INTERVAL: "3"
      PARACA_MAX_REQUESTS: "200"
      LOOP_SECONDS: "10500"
      FIELD_CSV_URL: ${{ secrets.FIELD_CSV_URL }}              # optional: published Google Sheet (CSV) of field checks
      TIMES_SNAPSHOTS_URL: ${{ vars.TIMES_SNAPSHOTS_URL }}     # optional: Times panel exports/parking_snapshots.csv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check out durable store (data branch) into ./store
        run: |
          git fetch --depth=1 origin data
          git worktree add --detach store origin/data

      - name: Collect hourly until the time budget is used
        env:
          ONE_SHOT: ${{ (github.event_name == 'push' || inputs.one_shot) && '1' || '0' }}
        run: scripts/hourly_loop.sh

      - name: Back up database as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paraca-sqlite-${{ github.run_id }}
          path: store/paraca.sqlite
          retention-days: 14

      - name: Start the next job in the chain
        if: always() && !cancelled() && !inputs.one_shot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main -R "${{ github.repository }}"
